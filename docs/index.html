<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>バチ納め衣装決め投票</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="demoNote" class="demo-note" hidden>
    デモモード：投票はこの端末にだけ保存されます（本番の集計には入りません）
    <button type="button" id="demoReset">リセット</button>
  </div>
  <header class="site">
    <div class="wrap">
      <div class="drums" aria-hidden="true">🏮🥁🏮</div>
      <h1>バチ<ruby>納<rt>おさ</rt></ruby>め <ruby>衣装<rt>いしょう</rt></ruby><ruby>決<rt>き</rt></ruby>め<ruby>投票<rt>とうひょう</rt></ruby></h1>
      <p class="deadline" id="deadline">&nbsp;</p>
    </div>
  </header>

  <main class="wrap">
    <section id="loading"><p class="center">よみこみ中…</p></section>

    <!-- 投票 -->
    <section id="voteView" hidden>
      <div class="panel">
        <h2><span class="step">1</span>おなまえを書いてね</h2>
        <input id="name" type="text" maxlength="30" autocomplete="name" placeholder="れい：やまだ たろう" aria-label="おなまえ">
        <p class="hint">同じ人が2回<ruby>投票<rt>とうひょう</rt></ruby>しないように使うよ。だれがどれをえらんだかは、だれにもわからないよ。</p>
      </div>
      <div class="panel">
        <h2><span class="step">2</span>すきな<ruby>衣装<rt>いしょう</rt></ruby>を3つえらんでね</h2>
        <p>タップしたじゅんに <b>1位 → 2位 → 3位</b> になるよ。もういちどタップすると とりけせるよ。<br>🔍 をおすと 大きく見られるよ。</p>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- 結果 -->
    <section id="resultView" hidden>
      <div class="panel thanks" id="thanks" hidden>
        <div class="big" aria-hidden="true">🎉</div>
        <h2><ruby>投票<rt>とうひょう</rt></ruby>ありがとう！</h2>
        <p id="thanksMsg"></p>
      </div>
      <div class="result-head">
        <h2 id="resultTitle">けっか</h2>
        <span class="status" id="resultStatus"></span>
      </div>
      <p class="print-row"><a class="btn" id="printLink" href="print.html">🖨 上位5つをA4でいんさつ</a></p>
      <div class="rank-list" id="rankList"></div>
    </section>

    <!-- 締切後で未投票、または結果がまだ見られない -->
    <section id="messageView" hidden>
      <div class="panel"><h2 id="msgTitle"></h2><p id="msgBody"></p></div>
    </section>
  </main>

  <div class="tray" id="tray" hidden>
    <div class="wrap">
      <div class="slots" id="slots"></div>
      <button class="submit" id="submit" disabled>おくる</button>
    </div>
  </div>

  <dialog id="confirmDlg">
    <div class="dlg-body">
      <h3>これで<ruby>投票<rt>とうひょう</rt></ruby>する？</h3>
      <p class="sub"><b id="confirmName" style="color:var(--ink)"></b> さん<br>おくったあとは かえられないよ</p>
      <div class="confirm-list" id="confirmList"></div>
      <p class="error" id="confirmError" hidden></p>
      <div class="dlg-actions">
        <button class="btn" id="cancelBtn">もどる</button>
        <button class="btn primary" id="sendBtn">投票する！</button>
      </div>
    </div>
  </dialog>

  <dialog id="lightbox" class="lightbox">
    <button class="close" aria-label="とじる" id="lbClose">×</button>
    <img id="lbImg" alt="">
  </dialog>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
