<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上位5位 印刷用</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
  <style>
    @page { size: A4 portrait; margin: 12mm; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #e9e6df; color: #1d2230;
      font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
    }
    .bar {
      position: sticky; top: 0; z-index: 2;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: #2c3e8f; color: #fff; font-size: 14px;
    }
    .bar a { color: #fff; }
    .bar button {
      font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 8px 16px;
      background: #e5432f; color: #fff; cursor: pointer;
    }
    /* A4 1枚（余白12mmを除いた 186 x 273mm） */
    .sheet {
      width: 186mm; height: 273mm; margin: 16px auto; background: #fff;
      display: flex; flex-direction: column; gap: 5mm;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .15);
      padding: 0;
    }
    @media screen { .sheet { outline: 12mm solid #fff; margin: calc(16px + 12mm) auto; } }
    h1 {
      margin: 0; text-align: center;
      font-weight: 800; font-size: 20pt; letter-spacing: .08em;
    }
    .top { flex: 0 0 auto; height: 112mm; }
    .rest { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; min-height: 0; }
    .item { position: relative; display: flex; flex-direction: column; min-height: 0; border: .3mm solid #d8d2c4; border-radius: 3mm; padding: 3mm; }
    .item .rank {
      font-weight: 800; font-size: 16pt; line-height: 1;
      margin-bottom: 2mm;
    }
    .top .rank { font-size: 24pt; }
    .item .ph { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .item img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .r1 .rank { color: #a87b1c; }
    .r2 .rank { color: #6d7581; }
    .r3 .rank { color: #8c4f2a; }
    .msg { text-align: center; padding: 60px 16px; color: #555; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .sheet { margin: 0; box-shadow: none; outline: 0; zoom: 1 !important; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="./">← 結果に戻る</a>
    <span id="note"></span>
    <button id="printBtn" disabled>印刷する</button>
  </div>
  <div id="root"><p class="msg">読み込み中…</p></div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    (async function () {
      const cfg = window.VOTE_CONFIG;
      const root = document.getElementById('root');
      const token = new URLSearchParams(location.search).get('t') || VotedStore.get();
      let res;
      try { res = await VoteApi.results(token); } catch (e) { res = { ok: false }; }
      if (!res.ok) {
        root.innerHTML = '<p class="msg">結果はまだ公開されていません。</p>';
        return;
      }
      document.getElementById('note').textContent = res.closed ? '最終結果' : '※途中経過です（締切前）';

      // 5位と同点のものはすべて含める
      const top = res.items.filter(it => it.rank <= 5 && it.points > 0);
      const card = (it, cls) => `
        <div class="item r${it.rank} ${cls || ''}">
          <div class="rank">${it.rank}位</div>
          <div class="ph"><img src="${imgSrc(it.id)}" alt="${it.rank}位"></div>
        </div>`;
      const [first, ...rest] = top;
      root.innerHTML = `
        <div class="sheet">
          <h1>${cfg.title}</h1>
          ${first ? card(first, 'top') : ''}
          <div class="rest" style="grid-template-rows:repeat(${Math.max(1, Math.ceil(rest.length / 2))}, minmax(0, 1fr))">
            ${rest.map(it => card(it)).join('')}
          </div>
        </div>`;

      // スマホ画面では用紙全体が見えるよう縮小表示（印刷サイズは変わらない）
      const sheet = root.querySelector('.sheet');
      const fit = () => { sheet.style.zoom = Math.min(1, (window.innerWidth - 24) / (sheet.offsetWidth + 2 * 45)); };
      fit();
      window.addEventListener('resize', fit);

      const imgs = [...root.querySelectorAll('img')];
      await Promise.all(imgs.map(img => img.complete ? null : new Promise(r => { img.onload = img.onerror = r; })));
      const btn = document.getElementById('printBtn');
      btn.disabled = false;
      btn.addEventListener('click', () => window.print());
    })();
  </script>
</body>
</html>
